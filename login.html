        <h1>Simulador de Escala 5x2</h1>
        <p>Entre com seu usuário e senha.</p>
      </div>
      <form class="login-body" id="login-form" novalidate>
        <label class="f"
          >Usuário<input
            id="usuario"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
            autofocus
        /></label>
        <label class="f"
          >Senha<span class="senha-campo"
            ><input
              id="senha"
              type="password"
              autocomplete="current-password"
              required
            /><button
              class="icon-btn"
              type="button"
              id="ver-senha"
              aria-label="Mostrar senha"
              aria-pressed="false"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
                <line class="risco" x1="4" y1="4" x2="20" y2="20" />
              </svg></button></span
        ></label>
        <p class="login-err" id="login-err" role="alert"></p>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
    </main>

    <script>
      const DESTINO = "index.html";
      const CHAVE = "padroniza-usuario";
      const TOTAL_LOGINS = 25;

      // usuario1 / user1, usuario2 / user2, ... usuario25 / user25
      const LOGINS = {};
      for (let i = 1; i <= TOTAL_LOGINS; i++) LOGINS[`usuario${i}`] = `user${i}`;

      try {
        if (sessionStorage.getItem(CHAVE)) location.replace(DESTINO);
      } catch (e) {}

      const erro = document.getElementById("login-err");
      const campoSenha = document.getElementById("senha");
      const verSenha = document.getElementById("ver-senha");

      verSenha.onclick = () => {
        const mostrar = campoSenha.type === "password";
        campoSenha.type = mostrar ? "text" : "password";
        verSenha.setAttribute("aria-pressed", mostrar);
      };

      document.getElementById("login-form").onsubmit = (e) => {
        e.preventDefault();
        const usuario = document
          .getElementById("usuario")
          .value.trim()
          .toLowerCase();

        if (LOGINS[usuario] !== campoSenha.value) {
          erro.textContent = "Usuário ou senha incorretos.";
          campoSenha.value = "";
          campoSenha.focus();
          return;
        }

        try {
          sessionStorage.setItem(CHAVE, usuario);
          location.href = DESTINO;
        } catch (x) {
          erro.textContent =
            "Não foi possível entrar. Verifique se o navegador permite salvar dados do site.";
        }
      };
    </script>
  </body>
